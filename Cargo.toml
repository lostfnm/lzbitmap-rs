[package]
name = "lzbitmap-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Apple LZBITMAP compression and decompression in safe, portable Rust"
license = "MIT"
repository = "https://github.com/lostfnm/lzbitmap-rs"
keywords = ["apple", "decmpfs", "compression", "lzbitmap", "decompression"]
categories = ["compression"]
exclude = ["/fuzz"]

[lib]
name = "lzbitmap"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cargo_common_metadata = "allow"
